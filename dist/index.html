<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<title>Selvakumar & Sujitha · Housewarming · புதுமனை புகுவிழா</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Mr. R.P Selvakumar & Mrs. Sujitha Selvakumar invite you to the housewarming of their new home — Friday, 30 October 2026, Sevoor.">
<meta property="og:type" content="website">
<meta property="og:title" content="Selvakumar & Sujitha · Housewarming · புதுமனை புகுவிழா">
<meta property="og:description" content="Friday, 30 October 2026 · 4:30 – 6:00 AM · Sevoor. Open the door to our new home.">
<meta name="theme-color" content="#fcf0f3">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Hind+Madurai:wght@400;500;600;700&family=Noto+Serif+Tamil:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- colours (Rani Pink & Parrot Green): every colour on the page comes from these ---------- */
:root{
  --bg:#fcf0f3; --bgGlow:#fde0e9; --card:#fffafb; --card2:#fbe3ea; --tint:#f9d3df;
  --ink:#4a2a35; --muted:#8c6670;
  --pri:#9c1458; --priRGB:156,20,88; --pri2:#d0306f; --onPri:#ffe6ef;
  --acc:#e0a106; --accRGB:224,161,6; --acc2:#ec6a3c;
  --gold:#c08f2f; --goldRGB:192,143,47; --goldsoft:#ecd3b8; --golddeep:#9a6d1f;
  --sec:#3d8b2f; --secD:#2a6620; --secTint:#eaf5e6;
  --priTint:#fdeaf1; --priLine:#f3c6d6; --shRGB:120,30,60;
  --g1:#5c1238; --g2:#380a22; --g3:#1f0514;
  --fr1:#fff8e2; --fr2:#ffe3a8; --fr3:#f3bf63;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Hind Madurai',sans-serif;color:var(--ink);background:var(--bg);
  /* kolam-dot wallpaper */
  background-image:
    radial-gradient(rgba(var(--priRGB),.07) 1.6px,transparent 2.2px),
    radial-gradient(rgba(var(--goldRGB),.09) 1.6px,transparent 2.2px),
    radial-gradient(ellipse at 50% -8%,var(--bgGlow),transparent 55%);
  background-size:28px 28px,28px 28px,100% 100%;
  background-position:0 0,14px 14px,0 0;
  min-height:100vh;overflow-x:hidden;transition:background-color .4s;
}
body.lock{overflow:hidden;height:100vh}
.disp{font-family:'Cormorant Garamond',serif;color:var(--pri)}
html[lang="ta"] .disp{font-family:'Noto Serif Tamil',serif;letter-spacing:0}
button{font-family:inherit}
.defs{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- progress bar ---------- */
#pg{position:fixed;top:0;left:0;height:3px;width:0;z-index:70;
  background:linear-gradient(90deg,var(--acc),var(--pri2),var(--sec));border-radius:0 3px 3px 0}

/* ---------- header pill ---------- */
#hd{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:30;
  display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--card) 92%,transparent);
  border:1px solid var(--goldsoft);border-radius:999px;padding:6px 7px 6px 15px;
  box-shadow:0 6px 20px rgba(var(--shRGB),.15);backdrop-filter:blur(6px);white-space:nowrap}
#hd .br{font-size:11px;letter-spacing:.14em;font-weight:600;color:var(--pri)}
html[lang="ta"] #hd .br{letter-spacing:.02em}
.lbtn{border:1px solid var(--goldsoft);background:#fff;border-radius:999px;min-width:34px;height:28px;
  padding:0 9px;font-size:12px;font-weight:600;color:var(--golddeep);cursor:pointer;transition:.25s}
.lbtn.on{background:var(--pri);border-color:var(--pri);color:var(--onPri)}
#mu{width:30px;height:30px;border-radius:50%;border:1px solid var(--goldsoft);cursor:pointer;
  background:#fff;color:var(--golddeep);font-size:14px;line-height:1;transition:.3s}
#mu.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 0 0 4px rgba(var(--accRGB),.22)}

/* ---------- canvas fx / toast ---------- */
#fx{position:fixed;inset:0;z-index:60;pointer-events:none}
#toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,16px);z-index:75;opacity:0;
  background:color-mix(in srgb,var(--g2) 94%,transparent);color:var(--onPri);padding:10px 18px;border-radius:999px;font-size:14px;
  max-width:88vw;text-align:center;pointer-events:none;transition:.35s}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;gap:14px;padding:20px;text-align:center;overflow:hidden auto;
  --dw:clamp(150px,calc((100vh - 360px) * .62),min(64vw,270px));
  background:radial-gradient(ellipse at 50% 108%,var(--g1),var(--g2) 55%,var(--g3) 100%);transition:opacity 1.1s}
#gate.hide{opacity:0;pointer-events:none}
#gate>*{flex-shrink:0}
#gate>:first-child{margin-top:auto}
#gate>:last-child{margin-bottom:auto}
#gate .gttl{font-size:clamp(26px,7vw,40px);color:#f6d78a;font-weight:700}
#gate .gsub{color:#ecd3a6;font-size:15px;max-width:34ch}
.gthn{display:block;width:116%;height:34px;margin:0 0 -8px -8%;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.dwrap{position:relative;width:var(--dw)}
.dframe{position:relative;width:100%;aspect-ratio:27/33;perspective:1000px;
  border:9px solid #7a4a21;border-radius:160px 160px 10px 10px;background:#2a0d06;
  box-shadow:0 0 0 3px #c9962f,0 18px 50px rgba(0,0,0,.55)}
.dint{position:absolute;inset:0;border-radius:148px 148px 4px 4px;overflow:hidden;
  background:radial-gradient(circle at 50% 62%,#ffe3a0,#f0b454 42%,#a85a1c 90%);
  display:flex;align-items:center;justify-content:center}
.dint .wel{font-family:'Noto Serif Tamil','Cormorant Garamond',serif;font-size:clamp(20px,5vw,27px);
  font-weight:700;color:var(--pri);text-shadow:0 1px 0 #ffd98c;opacity:0;transform:scale(.8);transition:1s .6s}
#gate.go .dint .wel{opacity:1;transform:scale(1)}
.door{position:absolute;top:0;bottom:0;width:50.5%;z-index:2;overflow:hidden;transition:transform 1.5s cubic-bezier(.65,0,.3,1);
  background:repeating-linear-gradient(90deg,#71391a 0 24%,#5c2b10 24% 26%,#7d4522 26% 49%,#61300f 49% 51%),
             linear-gradient(#7a4220,#5e2d10)}
.door::before{content:"";position:absolute;inset:14px 10px;border:1.5px solid rgba(233,191,99,.4);border-radius:8px;
  background-image:radial-gradient(#e9bf63 2.1px,rgba(233,191,99,0) 2.5px);background-size:200% 25%;
  background-position:50% 10%;background-repeat:repeat-y;opacity:.55}
.door::after{content:"";position:absolute;top:50%;width:9px;height:24px;border:3px solid #e9bf63;border-radius:8px}
.door.l{left:0;border-radius:148px 0 0 4px;transform-origin:0 50%;border-right:2px solid #3a1707}
.door.r{right:0;border-radius:0 148px 4px 0;transform-origin:100% 50%}
.door.l::before{border-radius:120px 8px 8px 8px}
.door.r::before{border-radius:8px 120px 8px 8px}
.door.l::after{right:6px}
.door.r::after{left:6px}
#gate.go .door.l{transform:rotateY(-108deg)}
#gate.go .door.r{transform:rotateY(108deg)}
.grang{position:relative;z-index:3;display:block;width:var(--dw);height:auto;margin-top:-6px;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.glamp{position:absolute;bottom:-4px;width:46px;z-index:3;filter:drop-shadow(0 0 10px rgba(255,170,60,.5))}
.glamp.gl{left:-30px}.glamp.gr{right:-30px}
#open{margin-top:4px;background:linear-gradient(135deg,#e9bf63,#c9962f);color:#3a1505;border:none;cursor:pointer;
  font-size:16px;font-weight:700;padding:13px 30px;border-radius:999px;box-shadow:0 8px 26px rgba(0,0,0,.45);transition:.3s}
#open:hover{transform:translateY(-2px)}

/* ---------- layout / cards ---------- */
main{max-width:660px;margin:0 auto;padding:84px 16px 40px}
.card{position:relative;background:var(--card);border:1px solid var(--goldsoft);border-radius:18px;
  box-shadow:0 12px 32px rgba(var(--shRGB),.09);padding:52px 24px 34px;margin:26px 0;text-align:center;
  overflow:hidden;opacity:0;transform:translateY(34px);transition:opacity .8s ease,transform .8s ease}
.card.on{opacity:1;transform:none}
.card::before{content:"";position:absolute;inset:7px;border:1px solid rgba(var(--goldRGB),.35);border-radius:12px;pointer-events:none}
.thn{position:absolute;top:0;left:14px;right:14px;width:calc(100% - 28px);height:32px}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:10px}
html[lang="ta"] .eyebrow{letter-spacing:.04em;text-transform:none;font-size:13px}
.hint{font-size:13.5px;color:var(--muted);margin-top:6px}
.linkish{background:none;border:none;color:var(--pri);font-size:14px;font-weight:600;cursor:pointer;
  text-decoration:underline;text-decoration-color:rgba(var(--priRGB),.35);text-underline-offset:4px;margin-top:16px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;border-radius:999px;
  padding:12px 22px;font-size:14.5px;font-weight:600;background:var(--pri);color:var(--onPri);
  box-shadow:0 6px 18px rgba(var(--priRGB),.3);transition:.25s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:#fff;color:var(--golddeep);border:1.5px solid var(--goldsoft);box-shadow:none}
.btn svg{width:17px;height:17px;flex:none}

/* ---------- hero ---------- */
.ganesha{display:block;width:44px;aspect-ratio:117/150;margin:0 auto 6px;background:var(--pri);
  -webkit-mask:var(--gmask) center/contain no-repeat;mask:var(--gmask) center/contain no-repeat}
.invoc{font-size:13.5px;font-weight:600;color:var(--pri);letter-spacing:.08em;margin-bottom:14px}
html[lang="ta"] .invoc{letter-spacing:.02em}
.hero h1{font-size:clamp(22px,5.6vw,31px);font-weight:700;line-height:1.3;margin-top:18px;overflow-wrap:break-word}
.hero h1 span{display:block}
.hero h1 .amp{font-size:.72em;color:var(--gold);margin:2px 0}
html[lang="ta"] .hero h1{font-size:clamp(19px,5vw,28px);line-height:1.45}
.hero .lead{max-width:44ch;margin:14px auto 4px;font-size:15.5px;line-height:1.75}
.hero .title{font-size:clamp(28px,7.6vw,42px);font-weight:700;line-height:1.2}
.gp{font-size:11.5px;letter-spacing:.26em;color:var(--gold);font-weight:600;margin-top:6px}
.datechip{display:inline-block;margin-top:18px;background:linear-gradient(135deg,var(--card),var(--card2));
  border:1px solid var(--goldsoft);color:var(--pri);font-weight:600;font-size:14.5px;
  padding:9px 22px;border-radius:999px}
.divid{width:120px;height:14px;margin:16px auto 0;color:var(--gold)}

/* ---------- artwork images ---------- */
.emblem{display:block;width:84px;height:auto;margin:0 auto 12px;opacity:.95}
.elephant{display:block;width:158px;height:auto;margin:4px auto 2px;transform-origin:50% 100%;
  animation:amble 3.4s ease-in-out infinite;filter:drop-shadow(0 10px 12px rgba(var(--shRGB),.16))}
@keyframes amble{0%,100%{transform:rotate(-1.6deg) translateY(0)}50%{transform:rotate(1.6deg) translateY(-3px)}}
.famDoor{display:block;width:min(340px,100%);height:auto;margin:16px auto 10px;border-radius:20px;
  box-shadow:0 0 0 5px var(--card),0 0 0 7px var(--gold),0 16px 34px rgba(var(--shRGB),.24)}
.couple{position:relative;width:min(260px,74%);aspect-ratio:4/5;margin:22px auto 4px;overflow:hidden;
  border-radius:50% 50% 18px 18px / 40% 40% 18px 18px;
  background:repeating-conic-gradient(from 0deg at 50% 55%,rgba(255,255,255,.26) 0 5deg,transparent 5deg 12deg),
             radial-gradient(circle at 50% 48%,var(--fr1) 0,var(--fr2) 44%,var(--fr3) 100%);
  box-shadow:0 0 0 5px var(--card),0 0 0 7px var(--gold),0 18px 36px rgba(var(--shRGB),.26)}
.couple img{position:absolute;left:4%;top:13%;width:92%;height:auto}
.tile.kids{padding-bottom:24px}
/* the children's photo as a polaroid pinned to a string of fairy lights */
.pola{position:relative;width:min(290px,86%);margin:4px auto 0;padding-top:30px}
.pola .str{position:absolute;top:0;left:-14%;width:128%;height:44px;overflow:visible}
.pola .pol{position:relative;background:#fffdf8;padding:10px 10px 38px;border-radius:3px;
  box-shadow:0 12px 26px rgba(var(--shRGB),.3),0 1px 2px rgba(0,0,0,.12);
  transform-origin:50% -14px;transform:rotate(-2.6deg);animation:sway 5.5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(-.6deg)}}
.pola .cap{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-family:'Cormorant Garamond',serif;
  font-style:italic;font-size:19px;color:var(--pri)}
.pola .peg{position:absolute;top:-17px;left:50%;width:13px;height:34px;transform:translateX(-50%);z-index:2;border-radius:3px;
  background:linear-gradient(90deg,#b98146,#e8bf86 50%,#a8713a);box-shadow:0 2px 4px rgba(0,0,0,.28)}
.pola .peg::after{content:"";position:absolute;left:-2px;right:-2px;top:13px;height:4px;border-radius:2px;background:#9aa1a6}
/* a photograph, not a cut-out: blurred lamp-lit room, warm grade, contact shadow, grain and vignette */
.ph{position:relative;aspect-ratio:5/4;overflow:hidden;isolation:isolate;filter:saturate(1.05) contrast(1.03) sepia(.07);
  background:linear-gradient(172deg,#f8dcae 0%,#eab06f 52%,#b8683a 100%)}
.ph .bk{position:absolute;inset:-14px;z-index:0;filter:blur(7px);
  background:radial-gradient(circle at 65% 68%,rgba(255,236,186,0.40) 0 11px,rgba(255,236,186,0) 14px),
    radial-gradient(circle at 23% 57%,rgba(255,236,186,0.50) 0 10px,rgba(255,236,186,0) 13px),
    radial-gradient(circle at 80% 25%,rgba(255,236,186,0.73) 0 15px,rgba(255,236,186,0) 18px),
    radial-gradient(circle at 95% 39%,rgba(255,236,186,0.55) 0 11px,rgba(255,236,186,0) 14px),
    radial-gradient(circle at 44% 44%,rgba(255,236,186,0.72) 0 10px,rgba(255,236,186,0) 13px),
    radial-gradient(circle at 12% 59%,rgba(255,236,186,0.49) 0 8px,rgba(255,236,186,0) 11px),
    radial-gradient(circle at 44% 41%,rgba(255,236,186,0.64) 0 15px,rgba(255,236,186,0) 18px),
    radial-gradient(circle at 74% 28%,rgba(255,236,186,0.37) 0 18px,rgba(255,236,186,0) 21px),
    radial-gradient(circle at 6% 31%,rgba(255,236,186,0.39) 0 18px,rgba(255,236,186,0) 21px),
    radial-gradient(circle at 78% 48%,rgba(255,236,186,0.52) 0 18px,rgba(255,236,186,0) 21px),
    radial-gradient(circle at 77% 59%,rgba(255,236,186,0.65) 0 15px,rgba(255,236,186,0) 18px),
    radial-gradient(circle at 30% 66%,rgba(255,236,186,0.72) 0 17px,rgba(255,236,186,0) 20px),
    radial-gradient(circle at 64% 36%,rgba(255,236,186,0.48) 0 17px,rgba(255,236,186,0) 20px),
    radial-gradient(circle at 20% 38%,rgba(255,236,186,0.52) 0 10px,rgba(255,236,186,0) 13px),
    radial-gradient(circle at 51% 66%,rgba(255,236,186,0.43) 0 12px,rgba(255,236,186,0) 15px),
    radial-gradient(circle at 68% 54%,rgba(255,236,186,0.37) 0 19px,rgba(255,236,186,0) 22px)}
.ph .fl{position:absolute;left:8%;right:8%;bottom:-18%;height:34%;z-index:0;border-radius:50%;
  background:radial-gradient(closest-side,rgba(70,25,5,.38),rgba(70,25,5,0))}
.ph img{position:absolute;left:5%;bottom:0;width:90%;height:auto;z-index:1;
  filter:drop-shadow(0 0 1.5px rgba(90,40,10,.45)) drop-shadow(0 8px 14px rgba(70,25,5,.3))}
.ph::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%,rgba(255,240,210,0) 52%,rgba(60,18,4,.42) 100%)}
.ph::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.32;mix-blend-mode:overlay;
  background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22140%22%20height%3D%22140%22%3E%3Cfilter%20id%3D%22n%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%22.85%22%20numOctaves%3D%222%22%20stitchTiles%3D%22stitch%22%2F%3E%3CfeColorMatrix%20values%3D%220%200%200%200%20.5%200%200%200%200%20.5%200%200%200%200%20.5%200%200%200%20.6%200%22%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20filter%3D%22url(%23n)%22%2F%3E%3C%2Fsvg%3E") 0 0/140px 140px}

/* ---------- verse ---------- */
.verse{white-space:pre-line;font-size:clamp(19px,4.6vw,24px);font-weight:600;line-height:1.75;margin:8px auto 2px;max-width:40ch}
.att{color:var(--muted);font-size:13.5px;margin-top:12px}

/* ---------- lamps ---------- */
.lrow{display:flex;justify-content:center;gap:6px;margin-top:18px;flex-wrap:nowrap}
.lamp{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:4px 2px;border-radius:12px;transition:.25s}
.lamp:hover{background:rgba(var(--accRGB),.08)}
.lamp .lsvg{width:56px;height:103px;display:block}
.lamp .lbl{font-size:12px;color:var(--muted);font-weight:600}
.lamp.lit .lbl{color:var(--acc2)}
.flm{opacity:1;transform-origin:30px 33px;transition:opacity .5s,transform .5s}
.lamp:not(.lit) .flm{opacity:0;transform:scale(.2)}
.fl2{transform-origin:30px 32px;animation:flick 2.3s ease-in-out infinite}
.lamp:nth-child(2) .fl2,.glamp.gr .fl2{animation-delay:-.7s}
.lamp:nth-child(3) .fl2{animation-delay:-1.3s}
.lamp:nth-child(4) .fl2{animation-delay:-.4s}
.lamp:nth-child(5) .fl2{animation-delay:-1.8s}
@keyframes flick{
  0%,100%{transform:scale(1) rotate(-1.6deg)}
  28%{transform:scale(.93,1.07) rotate(1.4deg)}
  56%{transform:scale(1.06,.94) rotate(-1.2deg)}
  80%{transform:scale(.97,1.04) rotate(1deg)}}
.glo{animation:glowp 3.2s ease-in-out infinite}
@keyframes glowp{0%,100%{opacity:.3}50%{opacity:.5}}

/* ---------- details ---------- */
.dateRib{display:flex;align-items:center;justify-content:center;gap:16px;margin:24px auto 0}
.drSide{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--pri);min-width:92px;
  padding:4px 2px;border-top:1.5px solid var(--gold);border-bottom:1.5px solid var(--gold)}
html[lang="ta"] .drSide{font-family:'Noto Serif Tamil',serif;font-size:17px;min-width:84px}
.drDay{font-family:'Cormorant Garamond',serif;font-size:66px;font-weight:700;line-height:1;color:var(--sec);
  font-variant-numeric:lining-nums;letter-spacing:.02em}
.drYear{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px;
  font-size:13px;font-weight:600;letter-spacing:.34em;text-indent:.34em;color:var(--gold)}
.drYear::before,.drYear::after{content:"";width:38px;height:1.5px;background:linear-gradient(90deg,transparent,var(--gold))}
.drYear::after{background:linear-gradient(90deg,var(--gold),transparent)}
.tl{position:relative;max-width:440px;margin:22px auto 0;text-align:left}
.tl::before{content:"";position:absolute;left:21px;top:28px;bottom:28px;width:2px;
  background:linear-gradient(var(--acc),var(--pri2));opacity:.55}
.tlItem{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:7px 0}
.tlNode{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 0 4px var(--card),0 6px 14px rgba(var(--accRGB),.35)}
.tlItem+.tlItem .tlNode{background:linear-gradient(135deg,var(--pri2),var(--pri));box-shadow:0 0 0 4px var(--card),0 6px 14px rgba(var(--priRGB),.3)}
.tlNode svg{width:22px;height:22px}
.tlCard{background:linear-gradient(var(--card),var(--card2));border:1px solid var(--goldsoft);border-radius:14px;padding:11px 14px 12px}
.tlPill{display:inline-block;font-size:12px;font-weight:600;color:var(--golddeep);background:var(--tint);border-radius:999px;padding:3px 11px;margin-bottom:7px;white-space:nowrap}
.tlPill b{font-size:14px;color:var(--pri);margin-right:3px}
.tlTitle{display:block;font-size:16px;color:var(--ink);line-height:1.4}
.tlCard small{display:block;font-size:13px;color:var(--muted);margin-top:3px;line-height:1.55}
.venue{position:relative;max-width:440px;margin:30px auto 0;padding:32px 16px 18px;border-radius:16px;border:1px solid var(--goldsoft);
  background:radial-gradient(rgba(var(--priRGB),.07) 1.2px,transparent 1.7px) 0 0/16px 16px,linear-gradient(var(--card),var(--card2))}
.vPin{position:absolute;top:-21px;left:50%;transform:translateX(-50%);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  background:var(--pri);color:var(--onPri);box-shadow:0 0 0 4px var(--card),0 6px 14px rgba(var(--priRGB),.35)}
.vPin svg{width:20px;height:20px}
.vLbl{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
html[lang="ta"] .vLbl{font-size:13px;letter-spacing:.04em;text-transform:none}
.vAddr{font-size:17px;font-weight:600;color:var(--pri);line-height:1.5;margin-top:4px}
html[lang="ta"] .vAddr{font-size:16px}
.vLand{display:inline-block;margin-top:9px;font-size:13px;color:var(--muted);background:#fff;border:1px dashed var(--goldsoft);border-radius:999px;padding:4px 13px}
.venue .btns{margin-top:16px}
.tiles{display:grid;grid-template-columns:1fr;gap:12px;max-width:440px;margin:14px auto 0}
.tile{background:#fff;border:1px solid var(--goldsoft);border-radius:14px;padding:15px 8px 14px}
.tIc{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--secTint);color:var(--sec);margin-bottom:6px}
.tile+.tile .tIc{background:var(--priTint);color:var(--pri2)}
.tIc svg{width:18px;height:18px}
.tLbl{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:9px;line-height:1.4}
html[lang="ta"] .tLbl{font-size:12.5px;letter-spacing:0;text-transform:none}
.calls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.call{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--pri);text-decoration:none;white-space:nowrap;
  background:var(--priTint);border:1px solid var(--priLine);border-radius:999px;padding:4px 12px}
.call svg{width:13px;height:13px}

/* ---------- countdown ---------- */
#cd{display:flex;gap:10px;justify-content:center;margin-top:18px}
#cd>div{background:linear-gradient(var(--card),var(--card2));border:1px solid var(--goldsoft);border-radius:14px;
  min-width:68px;padding:12px 6px 9px}
#cd b{display:block;font-family:'Cormorant Garamond',serif;font-size:30px;line-height:1;color:var(--pri);font-variant-numeric:lining-nums}
#cd small{font-size:11.5px;color:var(--muted);font-weight:600}
#cd b.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.22);color:var(--acc2)}}

/* ---------- closing ---------- */
.peacock{display:block;width:200px;max-width:80%;height:auto;margin:6px auto 12px;transform-origin:50% 100%}
.card.on .peacock{animation:fanOpen 1.1s cubic-bezier(.2,.8,.3,1.1) both}
@keyframes fanOpen{from{transform:scale(.7,.35);opacity:0}to{transform:none;opacity:1}}
.closeTxt{max-width:44ch;margin:8px auto 0;font-size:15.5px;line-height:1.8}
.sig{margin-top:18px;font-size:15px;color:var(--muted)}
.sig b{display:block;font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--pri);margin-top:4px}
.sig small{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
html[lang="ta"] .sig b{font-family:'Noto Serif Tamil',serif}
footer{text-align:center;color:var(--gold);font-size:12px;padding:6px 0 30px;letter-spacing:.4em}

/* ---------- overlay ---------- */
.ov{position:fixed;inset:0;z-index:72;background:color-mix(in srgb,var(--g3) 55%,transparent);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.35s}
.ov.on{opacity:1;pointer-events:auto}
.ovc{position:relative;background:var(--card);border:1px solid var(--goldsoft);border-radius:18px;
  max-width:420px;width:100%;padding:34px 26px 28px;text-align:center;transform:translateY(20px);transition:.35s;
  box-shadow:0 24px 60px rgba(var(--shRGB),.4)}
.ov.on .ovc{transform:none}
.ovc h4{font-family:'Cormorant Garamond',serif;color:var(--pri);font-size:21px;margin-bottom:10px}
html[lang="ta"] .ovc h4{font-family:'Noto Serif Tamil',serif}
.ovc p{font-size:14.5px;line-height:1.8}
.x{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:1px solid var(--goldsoft);
  background:#fff;color:var(--golddeep);cursor:pointer;font-size:14px}

@media (max-width:420px){
  main{padding:76px 14px 30px}
  .card{padding:46px 16px 28px}
  .lamp .lsvg{width:50px;height:92px}
  #cd>div{min-width:62px}
  .glamp.gl{left:-20px}.glamp.gr{right:-20px}
}
@media (prefers-reduced-motion:reduce){
  .fl2,.glo,.elephant,.card.on .peacock,.pola .pol{animation:none}
  .card{transition:none;opacity:1;transform:none}
}
</style>

/* ---------------- toast ---------------- */

  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2400)};

/* ---------------- petal engine (jasmine + marigold) ---------------- */
const cv=$("#fx"),cx=cv.getContext("2d");
const PCOLS=["#ffb13d","#f79824","#e8781e","#ffc96b"];   // marigold shades
let DPR=Math.min(2,devicePixelRatio||1),W=0,Hh=0,pts=[],rain=false,lt=0;
function rs(){W=innerWidth;Hh=innerHeight;cv.width=W*DPR;cv.height=Hh*DPR;cv.style.width=W+"px";cv.style.height=Hh+"px"}
rs();addEventListener("resize",rs);
const rnd=(a,b)=>a+Math.random()*(b-a);
function mkP(x,y,b){
  const r=Math.random(),kind=r<.38?"j":r<.92?"m":"l";   // jasmine / marigold / leaf
  return{x,y,b,kind,
    c:kind==="j"?(Math.random()<.5?"#fff7ec":"#fdeedd"):kind==="l"?"#3f9663":PCOLS[Math.random()*PCOLS.length|0],
    w:kind==="j"?rnd(5,8):rnd(7,12),h:kind==="j"?rnd(8,12):rnd(11,17),
    rot:rnd(0,6.3),vr:rnd(-.07,.07),ph:rnd(0,6.3),fl:rnd(.04,.1),
    vx:b?rnd(-5.5,5.5):rnd(-.25,.25),vy:b?rnd(-8,-2.5):rnd(.45,1),a:1}}
function burst(x,y,n){if(RM)return;for(let i=0;i<(n||24);i++)pts.push(mkP(x,y,1))}
function petal(w,h){cx.beginPath();cx.moveTo(0,-h/2);
  cx.bezierCurveTo(w*.55,-h*.2,w*.5,h*.28,0,h/2);
  cx.bezierCurveTo(-w*.5,h*.28,-w*.55,-h*.2,0,-h/2);cx.closePath();cx.fill()}
function loop(t){requestAnimationFrame(loop);if(document.hidden)return;
  const k=Math.min(3,(t-lt)/16.7||1);lt=t;cx.clearRect(0,0,cv.width,cv.height);
  if(rain){const want=W<500?10:16;
    if(pts.reduce((n,p)=>n+!p.b,0)<want&&Math.random()<.07)pts.push(mkP(rnd(0,W),-20,0))}
  pts=pts.filter(p=>p.y<Hh+30&&p.x>-30&&p.x<W+30&&p.a>0);
  for(const p of pts){p.ph+=p.fl*k;p.rot+=p.vr*k;
    if(p.b){p.vy=Math.min(2.2,p.vy+.24*k);p.vx*=Math.pow(.985,k);if(p.vy>1.9)p.a-=.012*k}
    p.x+=(p.vx+Math.sin(p.ph*.7)*.85)*k;p.y+=p.vy*k;
    const f=Math.cos(p.ph);cx.setTransform(DPR,0,0,DPR,p.x*DPR,p.y*DPR);cx.rotate(p.rot);
    cx.scale(1,Math.abs(f)<.22?.22:f);cx.globalAlpha=Math.max(0,p.a)*.92;cx.fillStyle=p.c;
    petal(p.w,p.h)}
  cx.setTransform(1,0,0,1,0,0);cx.globalAlpha=1}
if(!RM)requestAnimationFrame(loop);

/* ---------------- music: the family's song (CONFIG.music) ---------------- */
const song=new Audio(CONFIG.music);song.loop=true;song.preload="none";
let muOn=false,fadeT=null;
function fade(to,ms,done){clearInterval(fadeT);const from=song.volume,n=Math.max(1,Math.round(ms/50));let i=0;
  fadeT=setInterval(()=>{i++;song.volume=Math.min(1,Math.max(0,from+(to-from)*i/n));
    if(i>=n){clearInterval(fadeT);if(done)done()}},50)}
function setMusic(v){muOn=v;$("#mu").classList.toggle("on",v);
  if(v){clearInterval(fadeT);song.volume=0;
    song.play().then(()=>fade(.9,1600)).catch(()=>{muOn=false;$("#mu").classList.remove("on")})}
  else fade(0,350,()=>song.pause())}
$("#mu").onclick=()=>setMusic(!muOn);
document.addEventListener("visibilitychange",()=>{if(document.hidden)song.pause();else if(muOn)song.play().catch(()=>{})});

/* ---------------- gate: open the door ---------------- */
function openGate(){const g=$("#gate");if(g.classList.contains("go"))return;
  g.classList.add("go");
  setMusic(true);
  setTimeout(()=>{rain=true;const r=$(".dframe").getBoundingClientRect();
    burst(r.left+r.width/2,r.top+r.height*.35,36);
    setTimeout(()=>burst(innerWidth*.28,innerHeight*.3,16),320);
    setTimeout(()=>burst(innerWidth*.72,innerHeight*.3,16),520)},900);
  setTimeout(()=>g.classList.add("hide"),2000);
  setTimeout(()=>{g.remove();document.body.classList.remove("lock");revealVisible()},3100)}
$("#open").onclick=openGate;
$(".dframe").onclick=openGate;

/* ---------------- scroll reveals + progress ---------------- */
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting&&!document.body.classList.contains("lock"))e.target.classList.add("on")}),{threshold:.2});
$$(".card").forEach(c=>io.observe(c));
function revealVisible(){$$(".card").forEach(c=>{const b=c.getBoundingClientRect();
  if(b.top<innerHeight*.85&&b.bottom>0)c.classList.add("on")})}
let tk=0;addEventListener("scroll",()=>{if(tk)return;tk=1;requestAnimationFrame(()=>{
  const d=document.documentElement;$("#pg").style.width=(scrollY/(d.scrollHeight-innerHeight)*100||0)+"%";tk=0})},{passive:true});
$("#beg").onclick=()=>$("#bless").scrollIntoView({behavior:"smooth"});
$("#top").onclick=()=>scrollTo({top:0,behavior:"smooth"});

/* ---------------- light the five lamps ---------------- */
let lit=0;const LAMPS=$$(".lamp");
LAMPS.forEach(lp=>lp.addEventListener("click",e=>{
  if(lp.classList.contains("lit"))return;
  lp.classList.add("lit");lit++;
  burst(e.clientX??innerWidth/2,e.clientY??innerHeight/2,10);
  if(lit<LAMPS.length)toast(T[L].lampT[lit-1]);
  else{const r=lp.closest(".card").getBoundingClientRect();
    setTimeout(()=>{burst(r.left+r.width/2,Math.max(60,r.top+r.height/2),40);
      $("#lampH").dataset.i="lampHd";$("#lampHint").dataset.i="lampHintDone";
      $("#lampH").textContent=T[L].lampHd;$("#lampHint").textContent=T[L].lampHintDone;
      $("#relight").hidden=false;toast(T[L].lampDoneT)},300)}}));
$("#relight").onclick=()=>{lit=0;LAMPS.forEach(l=>l.classList.remove("lit"));
  $("#lampH").dataset.i="lampH";$("#lampHint").dataset.i="lampHint";
  $("#lampH").textContent=T[L].lampH;$("#lampHint").textContent=T[L].lampHint;
  $("#relight").hidden=true};

/* ---------------- overlay ---------------- */
const op=id=>$("#"+id).classList.add("on"),cl=id=>$("#"+id).classList.remove("on");

$$(".x").forEach(b=>b.onclick=()=>cl(b.dataset.c));
$$(".ov").forEach(o=>o.onclick=e=>{if(e.target===o)cl(o.id)});

/* ---------------- countdown ---------------- */
const EV=new Date(CONFIG.eventStart).getTime();let last=[];
function tick(f){const d=EV-Date.now(),t=T[L];
  if(d<=0){$("#cd").innerHTML="<p style='font-size:16px;font-weight:600;color:var(--mar)'>"+t.cddone+"</p>";return}
  const v=[d/864e5,d/36e5%24,d/6e4%60,d/1e3%60].map(Math.floor);
  if(f||!$("#cd b"))$("#cd").innerHTML=v.map((n,i)=>`<div><b>${n}</b><small>${t["DHMS"[i]]}</small></div>`).join("");
  else $$("#cd b").forEach((b,i)=>{if(last[i]!==v[i]){b.textContent=v[i];
    b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop")}});
  last=v}
setInterval(tick,1000);

/* ---------------- actions ---------------- */
$("#dirs").onclick=()=>window.open(CONFIG.mapsUrl,"_blank");
$("#cpy").onclick=async()=>{const a=CONFIG.address[L]+" ("+CONFIG.landmark[L]+")";
  try{await navigator.clipboard.writeText(a);toast(T[L].copied)}catch(e){toast(a)}};
